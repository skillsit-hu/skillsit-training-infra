# YAML anchor for shared image
x-solution-image: &solution-image ghcr.io/skillsit-hu/es2025-s17-training-competition-hu-module_c-solution:latest
x-content-service-url: &content-service-url https://content.ssa.skillsit.hu

services:
  c01_solution:
    image: *solution-image
    container_name: c01_solution
    restart: always
    networks:
      - gitea
    environment:
      DATABASE_URL: mysql://root:skill17@ssa.skillsit.hu:3306/c01_solution 
      CONTENT_SERVICE_URL: *content-service-url
      CORS_ORIGIN: "*"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.c01_solution.rule=Host(`c01-solution.ssa.skillsit.hu`)"
      - "traefik.http.routers.c01_solution.entrypoints=websecure"
      - "traefik.http.routers.c01_solution.tls=true"
      - "traefik.http.services.c01_solution.loadbalancer.server.port=5000"
      - "com.centurylinklabs.watchtower.enable=true"
