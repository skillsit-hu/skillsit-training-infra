services:
  content-services:
    image: ghcr.io/skillsit-hu/es2025-s17-training-competition-hu-module_c-content-services:latest
    container_name: content-services
    restart: unless-stopped
    networks:
      - gitea
    environment:
      - DATABASE_URL=mysql://root:skill17@ssa.skillsit.hu:3306/content_services
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.content-services.rule=Host(`content.ssa.skillsit.hu`)"
      - "traefik.http.routers.content-services.entrypoints=websecure"
      - "traefik.http.routers.content-services.tls=true"
      - "traefik.http.services.content-services.loadbalancer.server.port=5000"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  gitea:
    external: true