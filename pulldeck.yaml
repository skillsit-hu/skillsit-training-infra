services:
  pulldeck:
    image: ghcr.io/httpfoundation/pulldeck:latest
    container_name: pulldeck
    restart: always
    networks:
      - gitea
    env_file:
      - .env.clara
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/azureuser/infra:/home/azureuser/infra
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pulldeck.rule=HostRegexp(`^clara\\..+$`)"
      - "traefik.http.services.pulldeck.loadbalancer.server.port=3000"
      - "traefik.http.routers.pulldeck.entrypoints=websecure"
      - "traefik.http.routers.pulldeck.tls=true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s


networks:
  gitea:
    external: true
