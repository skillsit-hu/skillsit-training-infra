# Infra admin UI (https://github.com/skillsit-hu/skillsit-training-admin), a prebuilt image from ghcr.io.
# Started by install.sh together with traefik.yaml; stop/clean leave both running.
#
#   docker compose --env-file .admin.env -f admin.yaml pull
#   docker compose --env-file .admin.env -f admin.yaml up -d
#
# .admin.env (written by install.sh):
#   INFRA_DIR             absolute host path of this repository
#   ADMIN_SESSION_SECRET  keeps logins valid across container restarts
#   ADMIN_PORT            local fallback port, bound to 127.0.0.1 (default: 8090)
#   DRY_RUN=1             log the commands instead of running them
#   ADMIN_IMAGE           optional, e.g. a pinned tag (...:1.2.0) or a locally built image

# Own compose project: `up --remove-orphans` on the infra stacks would otherwise remove this container.
name: infra-admin

services:
  infra-admin:
    image: ${ADMIN_IMAGE:-ghcr.io/skillsit-hu/skillsit-training-admin:latest}
    container_name: infra-admin
    restart: unless-stopped
    networks:
      - gitea
    ports:
      # Fallback when Traefik is down: ssh -L 8090:127.0.0.1:8090 <server>
      - "127.0.0.1:${ADMIN_PORT:-8090}:8090"
    environment:
      - REPO_DIR=${INFRA_DIR:?INFRA_DIR is not set}
      - ADMIN_PORT=8090
      # Straight to the Gitea container; the public hostname goes through Traefik, which can hang once the runners start.
      - GITEA_API_URL=http://gitea:3000
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
      - DRY_RUN=${DRY_RUN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path as on the host: docker compose resolves the stacks' relative bind mounts (./config, ...)
      # inside this container, and the host daemon has to find them at the same place.
      - ${INFRA_DIR}:${INFRA_DIR}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.infra-admin.rule=HostRegexp(`^admin\\..+$`)"
      - "traefik.http.routers.infra-admin.entrypoints=websecure"
      - "traefik.http.routers.infra-admin.tls=true"
      - "traefik.http.services.infra-admin.loadbalancer.server.port=8090"

networks:
  gitea:
    external: true
