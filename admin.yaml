# Infra admin UI (app/). Not part of the start/stop/clean stacks, so it keeps running when the environment is torn down.
#
#   docker compose -f admin.yaml up -d --build
#
# Settings (shell environment or a .env file next to this one):
#   INFRA_DIR             absolute host path of this repository (default: /home/azureuser/infra)
#   ADMIN_PORT            port of the UI (default: 8090)
#   ADMIN_SESSION_SECRET  keeps logins valid across container restarts
#   DRY_RUN=1             log the commands instead of running them
services:
  infra-admin:
    build: ./app
    image: infra-admin:latest
    container_name: infra-admin
    restart: unless-stopped
    # Host network: Gitea's API is reached on 127.0.0.1:3000 like the scripts do, and the UI works
    # before traefik.yaml has created the gitea network.
    network_mode: host
    environment:
      - REPO_DIR=${INFRA_DIR:-/home/azureuser/infra}
      - ADMIN_PORT=${ADMIN_PORT:-8090}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
      - DRY_RUN=${DRY_RUN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path as on the host: docker compose resolves the stacks' relative bind mounts (./data, ./config)
      # inside this container, and the host daemon has to find them at the same place.
      - ${INFRA_DIR:-/home/azureuser/infra}:${INFRA_DIR:-/home/azureuser/infra}
