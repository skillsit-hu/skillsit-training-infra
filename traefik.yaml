# Base layer, started by install.sh. Own compose project so no `down` of the infra stacks can remove it;
# the gitea network is created outside compose (install.sh / init) for the same reason.
name: infra-traefik

services:
  traefik:
    image: traefik:v3.7.13
    container_name: traefik
    restart: unless-stopped
    networks:
      - gitea
      - default
    command:
      - '--log.level=DEBUG'
      - '--api.insecure=true'
      - '--providers.file.directory=/etc/traefik/dynamic'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
      # - '--entrypoints.websecure.address=:443'
      - '--entrypoints.websecure.address=:${REGISTRY_PORT}'
#      - '--providers.docker.defaultRule=HostRegexp(`{_:{{ index .Labels \"com.docker.compose.service\" }}\\..*}`)'
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=0.0.0.0/0"
      - "--entrypoints.websecure.proxyProtocol.trustedIPs=0.0.0.0/0"
      - '--providers.docker.defaultRule=HostRegexp(`.+`)'
      - '--serversTransport.insecureSkipVerify=true'
      - '--experimental.plugins.sablier.modulename=github.com/sablierapp/sablier'
      - '--experimental.plugins.sablier.version=v1.10.1'
      # Per-host Let's Encrypt certificates over HTTP-01 (port 80 must be reachable from the internet). Routers opt in
      # with tls.certresolver=${CERT_RESOLVER}; it is empty when letsencrypt is off in main-config.json, and then
      # the default certificate from config/traefik/config.yaml is served, as it is while a certificate is pending.
      # ACME_CA_SERVER=https://acme-staging-v02.api.letsencrypt.org/directory switches to the staging CA for testing.
      - '--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}'
      - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web'
      - '--certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}'
    ports:
      - '80:80'
      - '443:443'
      - '5000:5000'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      # Issued certificates. A named volume of this project, so clean keeps it: re-issuing on every init would
      # run into Let's Encrypt's rate limits (50 certificates per domain per week, 5 duplicates per week).
      - 'letsencrypt:/letsencrypt'
      - './config/traefik:/etc/traefik/dynamic'
      - './config/traefik/certs:/etc/certs/'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`${GITEA_HOSTNAME}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=${CERT_RESOLVER:-}"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

networks:
  gitea:
    external: true

volumes:
  letsencrypt:
