services:
  verdaccio:
    image: verdaccio/verdaccio
    container_name: 'verdaccio'
    labels:
      traefik.enable: 'true'
      traefik.http.routers.verdaccio.rule: HostRegexp(`^verdaccio\..+$`)
      traefik.http.services.verdaccio.loadbalancer.server.port: 4873
      traefik.http.routers.verdaccio.entrypoints: ${ENTRYPOINT}
      traefik.http.routers.verdaccio.tls: ${ENABLE_HTTPS}
    environment:
      - VERDACCIO_PORT=4873
    ports:
      - '4873:4873'
    volumes:
      - 'verdaccio:/verdaccio/storage'
      - './config/verdaccio:/verdaccio/conf'
    restart: always
    networks:
      - gitea
networks:
  gitea:
    external: true

volumes:
  verdaccio:
